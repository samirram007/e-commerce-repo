[project]
name = "erp-backend"
version = "0.1.0"
description = "E-commerce, Inventory, Delivery and Accounting ERP backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pymysql>=1.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "filetype>=1.2",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.uv]
package = false
# pyyaml has no cp315 wheels, and uvicorn only needs it for `--config *.yaml`,
# which this project never uses. Dropping it keeps the Python 3.15 venv
# installable entirely from wheels (no MSVC build toolchain required).
# It still installs on Python <= 3.14, where wheels exist.
override-dependencies = ["pyyaml==6.0.3; python_version < '3.15'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
