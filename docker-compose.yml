services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_change_me
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://erp:erp_dev_change_me@db:5432/erp
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-me
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_STOREFRONT_SLUG: default
    ports:
      - "5173:5173"
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm run dev -- --host"

volumes:
  pgdata:
